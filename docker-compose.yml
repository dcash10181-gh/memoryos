services:
  neo4j:
    image: neo4j:5.21-community
    container_name: memoryos-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt protocol (driver connection)
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-memoryos_default}"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "2G"
      NEO4J_dbms_memory_pagecache_size: "512m"
      NEO4J_dbms_default__listen__address: "0.0.0.0"
    volumes:
      - memoryos_neo4j_data:/data
      - memoryos_neo4j_logs:/logs
      - memoryos_neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  memoryos_neo4j_data:
  memoryos_neo4j_logs:
  memoryos_neo4j_plugins:
